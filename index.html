<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم الكوينز | تحديث السرعة القصوى</title>
    <style>
        :root {
            --primary-color: #ffd700;
            --bg-color: #020617;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --special: #f43f5e;
            --text-light: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 80px 20px;
            margin: 0;
            user-select: none;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .ad-container {
            width: 100%; max-width: 728px; height: 90px; background: #0f172a;
            border: 1px dashed #475569; display: flex; align-items: center;
            justify-content: center; color: #64748b; margin-bottom: 20px; border-radius: 10px;
        }

        .header { width: 100%; max-width: 800px; text-align: center; }
        .player-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        #coin-count { font-size: 4rem; color: var(--primary-color); text-shadow: 0 0 20px gold; margin: 10px 0; transition: transform 0.1s; }
        .exp-container { background: #334155; height: 12px; border-radius: 6px; overflow: hidden; margin: 10px 0; }
        #exp-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #38bdf8, #818cf8); transition: 0.3s; }

        .game-area { position: relative; margin: 20px 0 40px; }
        .coin-btn {
            width: 180px; height: 180px; border-radius: 50%; cursor: pointer;
            font-size: 5rem; display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s; border: 8px solid #b38f00;
            background: radial-gradient(circle, #ffde33, #e6b800);
            box-shadow: 0 12px 0 #997a00; z-index: 10; position: relative;
            outline: none; -webkit-tap-highlight-color: transparent;
        }
        .coin-btn:active { transform: translateY(8px) scale(0.95); box-shadow: 0 4px 0 #997a00; }

        .particle {
            position: fixed; pointer-events: none; font-weight: bold; font-size: 1.2rem;
            color: var(--primary-color); text-shadow: 1px 1px 5px black;
            animation: floatUp 0.6s ease-out forwards; z-index: 1000;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.3); }
        }

        .main-layout { display: flex; flex-wrap: wrap; gap: 20px; width: 100%; max-width: 1200px; justify-content: center; }
        .column { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 20px; }
        .box { background: var(--card-bg); padding: 20px; border-radius: 15px; border: 1px solid #334155; }
        h3 { border-bottom: 2px solid #334155; padding-bottom: 10px; text-align: center; color: var(--accent); margin-top: 0; }

        .item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px; border-radius: 10px; margin-bottom: 8px; }
        .btn { border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .buy { background: #22c55e; color: white; }
        .buy:disabled { background: #475569; cursor: not-allowed; opacity: 0.7; }

        .skin-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .skin-unit { aspect-ratio: 1; background: #0f172a; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 2rem; border: 2px solid transparent; }
        .skin-unit.active { border-color: var(--accent); background: #1e293b; }
        .skin-unit.locked { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }

        footer { position: fixed; bottom: 0; left: 0; width: 100%; background: #0f172a; padding: 15px 0; border-top: 1px solid #334155; text-align: center; z-index: 100; }
        .footer-links { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; padding: 0 10px; }
        .footer-links span { color: #94a3b8; cursor: pointer; font-size: 0.9rem; text-decoration: underline; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; }
        .modal-box { background: var(--card-bg); padding: 30px; border-radius: 15px; border: 1px solid var(--accent); width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; text-align: right; }
        .close-modal-btn { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 20px; font-weight: bold; }
        
        #save-notification { position: fixed; bottom: 80px; right: 20px; background: #22c55e; color: white; padding: 10px 20px; border-radius: 8px; opacity: 0; transition: 0.5s; z-index: 1000; pointer-events: none;}
    </style>
</head>
<body>

    <div id="save-notification">تم الحفظ ✓</div>

    <div id="name-modal" class="modal-overlay">
        <div class="modal-box" style="text-align: center; max-width: 400px;">
            <h2>عالم الكوينز</h2>
            <input type="text" id="player-name-input" placeholder="اسمك المستعار..." maxlength="12" style="width:100%; padding:10px; margin-bottom:15px; border-radius:5px; border:1px solid #334155; background:#0f172a; color:white; text-align:center;">
            <button class="btn buy" style="width: 100%; padding: 12px;" onclick="saveName()">ابدأ اللعب</button>
        </div>
    </div>

    <div id="info-modal" class="modal-overlay">
        <div class="modal-box">
            <h2 id="info-title">العنوان</h2>
            <div id="info-content">المحتوى...</div>
            <button class="close-modal-btn" onclick="closeInfoModal()">إغلاق</button>
        </div>
    </div>

    <div class="ad-container"><small>مساحة إعلانية Google AdSense</small></div>

    <div class="header">
        <div class="player-info">
            <div>مستوى <span id="lvl">1</span></div>
            <div id="player-name-display">اللاعب</div>
        </div>
        <div class="exp-container"><div id="exp-fill"></div></div>
        <div id="coin-count">0</div>
        <p style="color: #64748b; font-size: 0.9rem;">قوة الضغطة: <span id="stat-power">6</span> | سرعة التلقائي: <span id="stat-speed">1.0</span>ث</p>
    </div>

    <div class="game-area">
        <button class="coin-btn" id="coin" onclick="handleMine(event)">💰</button>
    </div>

    <div class="main-layout">
        <div class="column">
            <div class="box">
                <h3>ترقيات النظام</h3>
                <div class="item">
                    <div>قوة الضغطة (+2)<br><small>السعر: <span id="c1">50</span></small></div>
                    <button class="btn buy" id="b1" onclick="upgradeClick()">تطوير</button>
                </div>
                <div class="item">
                    <div>تعدين آلي (+5)<br><small>السعر: <span id="c2">150</span></small></div>
                    <button class="btn buy" id="b2" onclick="upgradeAuto()">تطوير</button>
                </div>
                <div class="item" style="border: 1px solid var(--accent);">
                    <div>سرعة التلقائي (أسرع 10%)<br><small>السعر: <span id="c-speed">1000</span></small></div>
                    <button class="btn buy" id="b-speed" onclick="upgradeSpeed()" style="background:var(--accent)">تسريع</button>
                </div>
            </div>
        </div>

        <div class="column">
            <div class="box">
                <h3>الأشكال (Skins)</h3>
                <div class="skin-grid" id="skin-grid"></div>
            </div>
            <div class="box">
                <h3>لوحة الصدارة</h3>
                <div id="leaderboard"></div>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <span onclick="openPage('about_game')">عن اللعبة</span>
            <span onclick="openPage('privacy')">الخصوصية</span>
            <span onclick="openPage('contact')">خدمة العملاء</span>
        </div>
    </footer>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSynth(freq, type, duration, vol) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }
        const sounds = {
            click: () => playSynth(600, 'sine', 0.1, 0.1),
            buy: () => playSynth(400, 'triangle', 0.2, 0.1),
            lvl: () => playSynth(800, 'sine', 0.5, 0.2)
        };

        let gameData = { 
            name: "", coins: 0, clickPower: 6, autoRate: 0, 
            autoSpeed: 1000, // سرعة التلقائي بالميلي ثانية
            level: 1, exp: 0, expNext: 100, 
            pClick: 50, pAuto: 150, pSpeed: 1000, currentSkin: 0 
        };

        const skins = [
            {i: "💰", l: 1, c: "#ffde33", b: "#b38f00"}, {i: "🪙", l: 3, c: "#cbd5e1", b: "#64748b"},
            {i: "🔥", l: 5, c: "#f97316", b: "#9a3412"}, {i: "🧊", l: 10, c: "#38bdf8", b: "#0369a1"},
            {i: "💎", l: 20, c: "#a5f3fc", b: "#0ea5e9"}, {i: "🛸", l: 30, c: "#4ade80", b: "#166534"}
        ];

        let autoTimer;

        function startAutoClicker() {
            if (autoTimer) clearInterval(autoTimer);
            autoTimer = setInterval(() => {
                if (gameData.autoRate > 0) {
                    gameData.coins += gameData.autoRate;
                    gainExp(gameData.autoRate * 0.1);
                    // تأثير بصري خفيف للتلقائي
                    createParticle(null, null, gameData.autoRate, true);
                    updateUI();
                }
            }, gameData.autoSpeed);
        }

        function handleMine(e) {
            sounds.click();
            gameData.coins += gameData.clickPower;
            gainExp(gameData.clickPower);
            createParticle(e.clientX, e.clientY, gameData.clickPower, false);
            updateUI();
        }

        function createParticle(x, y, amount, isAuto) {
            const btn = document.getElementById('coin');
            const rect = btn.getBoundingClientRect();
            if (!x) x = rect.left + rect.width / 2;
            if (!y) y = rect.top + rect.height / 2;

            const p = document.createElement('div');
            p.className = 'particle';
            p.innerText = `+${Math.floor(amount)}`;
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            p.style.color = isAuto ? '#38bdf8' : 'var(--primary-color)';
            
            p.style.setProperty('--x', ((Math.random() - 0.5) * 100) + 'px');
            p.style.setProperty('--y', (-100 - Math.random() * 50) + 'px');
            
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 600);
        }

        function gainExp(amt) {
            gameData.exp += amt;
            if (gameData.exp >= gameData.expNext) {
                gameData.level++; gameData.exp = 0; gameData.expNext *= 1.8;
                sounds.lvl(); renderSkins(); updateUI();
            }
        }

        function upgradeClick() {
            if(gameData.coins >= gameData.pClick) {
                gameData.coins -= gameData.pClick; gameData.clickPower += 2; 
                gameData.pClick = Math.floor(gameData.pClick * 1.5); sounds.buy(); updateUI();
            }
        }

        function upgradeAuto() {
            if(gameData.coins >= gameData.pAuto) {
                gameData.coins -= gameData.pAuto; gameData.autoRate += 5; 
                gameData.pAuto = Math.floor(gameData.pAuto * 1.6); sounds.buy(); updateUI();
            }
        }

        function upgradeSpeed() {
            if(gameData.coins >= gameData.pSpeed && gameData.autoSpeed > 100) {
                gameData.coins -= gameData.pSpeed;
                gameData.autoSpeed = Math.max(100, gameData.autoSpeed - 100); // تقليل وقت الانتظار (تسريع)
                gameData.pSpeed = Math.floor(gameData.pSpeed * 2);
                sounds.buy();
                startAutoClicker(); // إعادة تشغيل التايمر بالسرعة الجديدة
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('coin-count').innerText = Math.floor(gameData.coins);
            document.getElementById('lvl').innerText = gameData.level;
            document.getElementById('exp-fill').style.width = Math.min((gameData.exp/gameData.expNext*100), 100) + "%";
            document.getElementById('stat-power').innerText = gameData.clickPower;
            document.getElementById('stat-speed').innerText = (gameData.autoSpeed / 1000).toFixed(1);
            document.getElementById('c1').innerText = gameData.pClick;
            document.getElementById('c2').innerText = gameData.pAuto;
            document.getElementById('c-speed').innerText = gameData.pSpeed;
            document.getElementById('b1').disabled = gameData.coins < gameData.pClick;
            document.getElementById('b2').disabled = gameData.coins < gameData.pAuto;
            document.getElementById('b-speed').disabled = gameData.coins < gameData.pSpeed || gameData.autoSpeed <= 100;
            renderSkins();
        }

        function renderSkins() {
            const grid = document.getElementById('skin-grid'); grid.innerHTML = '';
            skins.forEach((s, i) => {
                const div = document.createElement('div'); const locked = gameData.level < s.l;
                div.className = `skin-unit ${locked ? 'locked' : ''} ${gameData.currentSkin === i ? 'active' : ''}`;
                div.innerHTML = s.i;
                if(!locked) div.onclick = () => { gameData.currentSkin = i; applySkin(i); };
                grid.appendChild(div);
            });
        }

        function applySkin(i) {
            const s = skins[i]; const btn = document.getElementById('coin');
            btn.innerHTML = s.i; btn.style.background = `radial-gradient(circle, ${s.c}, ${s.b})`;
            btn.style.borderColor = s.b; btn.style.boxShadow = `0 12px 0 ${s.b}`;
        }

        function saveName() {
            const n = document.getElementById('player-name-input').value.trim();
            if(n) { gameData.name = n; document.getElementById('player-name-display').innerText = n; document.getElementById('name-modal').style.display = 'none'; startAutoClicker(); save(); }
        }

        function save() {
            localStorage.setItem('coinGameSpeedUpdate', JSON.stringify(gameData));
            const noti = document.getElementById('save-notification'); noti.style.opacity = '1'; setTimeout(() => noti.style.opacity = '0', 2000);
        }

        function load() {
            const s = localStorage.getItem('coinGameSpeedUpdate');
            if(s) { 
                gameData = {...gameData, ...JSON.parse(s)}; 
                document.getElementById('player-name-display').innerText = gameData.name;
                startAutoClicker();
            } else { document.getElementById('name-modal').style.display = 'flex'; }
        }

        const pages = {
            'about_game': { t: 'عن اللعبة', c: 'لعبة كليكر سعودية 100% تهدف للوصول لأعلى ليفل وأسرع ضغط تلقائي!' },
            'privacy': { t: 'الخصوصية', c: 'بياناتك محفوظة في متصفحك فقط. لا نقوم بجمع أي معلومات شخصية.' },
            'contact': { t: 'الدعم', c: 'راسلني على تيك توك أو إكس لأي اقتراح جديد!' }
        };

        function openPage(id) {
            document.getElementById('info-title').innerHTML = pages[id].t;
            document.getElementById('info-content').innerHTML = pages[id].c;
            document.getElementById('info-modal').style.display = 'flex';
        }
        function closeInfoModal() { document.getElementById('info-modal').style.display = 'none'; }

        setInterval(save, 10000);
        window.onload = () => { load(); updateUI(); applySkin(gameData.currentSkin); };
    </script>
</body>
</html>
