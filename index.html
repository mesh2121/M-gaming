<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم الكوينز | تحديث القوة القصوى x2</title>
    <style>
        :root {
            --primary: #ffd700;
            --bg: #020617;
            --card: #1e293b;
            --accent: #38bdf8;
            --danger: #f43f5e;
            --power: #a855f7; /* لون الموُضاعف الجديد */
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 100px;
            margin: 0;
            user-select: none;
            overflow-x: hidden;
        }

        /* تحسينات الواجهة - العلوية */
        .status-bar {
            width: 100%; max-width: 600px; background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px); padding: 15px; border-radius: 20px;
            border: 1px solid #334155; position: sticky; top: 10px; z-index: 100;
        }

        #coin-count {
            font-size: 3.5rem; color: var(--primary); font-weight: 900;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.4); margin: 5px 0;
            transition: 0.1s;
        }

        /* نظام التنبيه للمضاعف x2 */
        #multiplier-badge {
            background: linear-gradient(45deg, var(--power), #d8b4fe);
            color: white; padding: 5px 15px; border-radius: 50px;
            font-weight: bold; font-size: 1rem; display: none;
            animation: pulse 1s infinite; margin-top: 5px;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0px var(--power); }
            50% { transform: scale(1.1); box-shadow: 0 0 20px var(--power); }
            100% { transform: scale(1); box-shadow: 0 0 0px var(--power); }
        }

        /* العملة الرئيسية */
        .coin-wrap { position: relative; margin: 40px 0; cursor: pointer; }
        .main-coin {
            width: 200px; height: 200px; border-radius: 50%;
            font-size: 6rem; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle, #ffde33, #e6b800);
            border: 8px solid #b38f00; box-shadow: 0 12px 0 #997a00;
            transition: 0.05s;
        }
        .main-coin:active { transform: scale(0.92) translateY(10px); box-shadow: 0 2px 0 #997a00; }

        /* تأثير الشاشة عند تفعيل القوة القصوى */
        .active-boost-bg { animation: shake 0.5s infinite; background: radial-gradient(circle, #1e1b4b 0%, #020617 100%) !important; }
        @keyframes shake { 0% { transform: translate(0,0); } 25% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -1px); } 100% { transform: translate(0,0); } }

        /* الأقسام السفلية */
        .shop-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px; width: 100%; max-width: 1000px; margin-top: 20px;
        }
        .shop-card {
            background: var(--card); padding: 20px; border-radius: 18px;
            border: 1px solid #334155; position: relative; overflow: hidden;
        }
        .shop-card.locked { opacity: 0.5; filter: blur(1px); pointer-events: none; }
        
        .btn-upgrade {
            width: 100%; border: none; padding: 12px; border-radius: 10px;
            font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px;
            background: #22c55e; color: white;
        }
        .btn-upgrade:disabled { background: #475569; cursor: not-allowed; }

        /* الجسيمات المتطايرة */
        .particle {
            position: fixed; pointer-events: none; font-weight: 900;
            animation: float 0.7s ease-out forwards; z-index: 1000;
        }
        @keyframes float {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.5); }
        }
    </style>
</head>
<body id="body">

    <div class="status-bar">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div><span id="player-name" style="color:var(--accent)">القائد</span> | ليفل <span id="lvl">1</span></div>
            <div id="multiplier-badge">⚡ ناتج الضغط x2 مفعل</div>
        </div>
        <div style="background: #334155; height: 8px; border-radius: 4px; margin: 10px 0; overflow: hidden;">
            <div id="exp-bar" style="width: 0%; height: 100%; background: var(--accent); transition: 0.3s;"></div>
        </div>
        <div id="coin-count">0</div>
        <div style="font-size: 0.8rem; color: #94a3b8;">الضغط: <span id="pwr">6</span> | التلقائي: <span id="auto">0</span></div>
    </div>

    <div class="coin-wrap" onclick="tap(event)">
        <div class="main-coin" id="coin-btn">💰</div>
    </div>

    <div class="shop-container">
        <div class="shop-card" style="border: 2px solid var(--power);">
            <h3 style="margin-top:0; color:var(--power)">نظام الشحن (x2 للضغط)</h3>
            <p style="font-size: 0.85rem; color:#94a3b8;">يضاعف أرباح كل ضغطة يدوية للأبد!</p>
            <button class="btn-upgrade" id="u-mult" onclick="buyMultiplier()" style="background:var(--power)">
                ترقية للأبد (<span id="p-mult">2000</span>)
            </button>
        </div>

        <div class="shop-card">
            <h3>قوة اليد (+5)</h3>
            <button class="btn-upgrade" id="u-click" onclick="buyClick()">ترقية (<span id="p-click">50</span>)</button>
        </div>

        <div class="shop-card">
            <h3>منجم آلي (+10)</h3>
            <button class="btn-upgrade" id="u-auto" onclick="buyAuto()">ترقية (<span id="p-auto">150</span>)</button>
        </div>
    </div>

    <script>
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        function sfx(f, t, d, v) {
            try { if(ctx.state==='suspended')ctx.resume(); const o=ctx.createOscillator(), g=ctx.createGain();
            o.type=t; o.frequency.setValueAtTime(f, ctx.currentTime); g.gain.setValueAtTime(v, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+d); o.connect(g); g.connect(ctx.destination);
            o.start(); o.stop(ctx.currentTime+d); } catch(e){}
        }

        let data = {
            coins: 0, click: 6, auto: 0, mult: 1, 
            pClick: 50, pAuto: 150, pMult: 2000,
            lvl: 1, exp: 0, expN: 100
        };

        function tap(e) {
            sfx(500, 'sine', 0.1, 0.1);
            let gain = data.click * data.mult;
            data.coins += gain;
            data.exp += gain;
            
            checkLvl();
            createPart(e.clientX, e.clientY, gain);
            update();
        }

        function createPart(x, y, amt) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerText = `+${amt}`;
            p.style.left = x + 'px'; p.style.top = y + 'px';
            p.style.color = data.mult > 1 ? 'var(--power)' : 'var(--primary)';
            p.style.setProperty('--tx', (Math.random()-0.5)*200 + 'px');
            p.style.setProperty('--ty', (-150-Math.random()*100) + 'px');
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 700);
        }

        function buyMultiplier() {
            if(data.coins >= data.pMult) {
                data.coins -= data.pMult;
                data.mult = 2; // تفعيل الضرب في 2
                data.pMult = Math.floor(data.pMult * 5); // الترقية القادمة أغلى بكثير
                sfx(800, 'square', 0.2, 0.1);
                document.getElementById('body').classList.add('active-boost-bg');
                update();
            }
        }

        function buyClick() {
            if(data.coins >= data.pClick) {
                data.coins -= data.pClick; data.click += 5;
                data.pClick = Math.floor(data.pClick * 1.5);
                sfx(400, 'triangle', 0.1, 0.1); update();
            }
        }

        function buyAuto() {
            if(data.coins >= data.pAuto) {
                data.coins -= data.pAuto; data.auto += 10;
                data.pAuto = Math.floor(data.pAuto * 1.6);
                sfx(300, 'sawtooth', 0.1, 0.05); update();
            }
        }

        function checkLvl() {
            if(data.exp >= data.expN) {
                data.lvl++; data.exp = 0; data.expN = Math.floor(data.expN * 1.8);
                sfx(600, 'sine', 0.5, 0.2);
                alert("مبروك! ارتفع مستواك لـ " + data.lvl);
            }
        }

        function update() {
            document.getElementById('coin-count').innerText = Math.floor(data.coins);
            document.getElementById('lvl').innerText = data.lvl;
            document.getElementById('exp-bar').style.width = (data.exp/data.expN*100) + "%";
            document.getElementById('pwr').innerText = data.click * data.mult;
            document.getElementById('auto').innerText = data.auto;
            
            document.getElementById('p-click').innerText = data.pClick;
            document.getElementById('p-auto').innerText = data.pAuto;
            document.getElementById('p-mult').innerText = data.pMult;

            document.getElementById('u-click').disabled = data.coins < data.pClick;
            document.getElementById('u-auto').disabled = data.coins < data.pAuto;
            document.getElementById('u-mult').disabled = data.coins < data.pMult;

            if(data.mult > 1) document.getElementById('multiplier-badge').style.display = 'block';
            
            localStorage.setItem('coinGameV4', JSON.stringify(data));
        }

        setInterval(() => {
            if(data.auto > 0) {
                data.coins += data.auto;
                data.exp += data.auto * 0.1;
                checkLvl(); update();
            }
        }, 1000);

        window.onload = () => {
            const saved = localStorage.getItem('coinGameV4');
            if(saved) data = JSON.parse(saved);
            update();
        };
    </script>
</body>
</html>
