<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم الكوينز | المؤثرات والتحسينات</title>
    <style>
        :root {
            --primary-color: #ffd700;
            --bg-color: #020617;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --special: #f43f5e;
            --text-light: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 80px 20px;
            margin: 0;
            user-select: none;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* حاوية إعلانات */
        .ad-container {
            width: 100%; max-width: 728px; height: 90px; background: #0f172a;
            border: 1px dashed #475569; display: flex; align-items: center;
            justify-content: center; color: #64748b; margin-bottom: 20px; border-radius: 10px;
        }

        /* رأس الصفحة */
        .header { width: 100%; max-width: 800px; text-align: center; }
        .player-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        #coin-count { font-size: 4rem; color: var(--primary-color); text-shadow: 0 0 20px gold; margin: 10px 0; transition: transform 0.1s; }
        .exp-container { background: #334155; height: 12px; border-radius: 6px; overflow: hidden; margin: 10px 0; }
        #exp-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #38bdf8, #818cf8); transition: 0.3s; }

        /* منطقة اللعب وتأثير التطاير */
        .game-area { position: relative; margin: 20px 0 40px; }
        .coin-btn {
            width: 180px; height: 180px; border-radius: 50%; cursor: pointer;
            font-size: 5rem; display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s; border: 8px solid #b38f00;
            background: radial-gradient(circle, #ffde33, #e6b800);
            box-shadow: 0 12px 0 #997a00; z-index: 10; position: relative;
            outline: none;
        }
        .coin-btn:active { transform: translateY(8px) scale(0.95); box-shadow: 0 4px 0 #997a00; }

        /* ستايل الكوين المتطايرة */
        .particle {
            position: absolute;
            pointer-events: none;
            font-weight: bold;
            font-size: 1.5rem;
            color: var(--primary-color);
            text-shadow: 1px 1px 5px black;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.5); }
        }

        /* الحاويات الرئيسية */
        .main-layout { display: flex; flex-wrap: wrap; gap: 20px; width: 100%; max-width: 1200px; justify-content: center; }
        .column { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 20px; }
        .box { background: var(--card-bg); padding: 20px; border-radius: 15px; border: 1px solid #334155; }
        h3 { border-bottom: 2px solid #334155; padding-bottom: 10px; text-align: center; color: var(--accent); margin-top: 0; }

        /* العناصر داخل القوائم */
        .item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px; border-radius: 10px; margin-bottom: 8px; }
        .btn { border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .buy { background: #22c55e; color: white; }
        .buy:disabled { background: #475569; cursor: not-allowed; }

        /* سكنات */
        .skin-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .skin-unit { aspect-ratio: 1; background: #0f172a; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.5rem; border: 2px solid transparent; }
        .skin-unit.active { border-color: var(--accent); background: #1e293b; }
        .skin-unit.locked { opacity: 0.3; filter: grayscale(1); }

        /* الفوتر */
        footer { position: fixed; bottom: 0; left: 0; width: 100%; background: #0f172a; padding: 15px 0; border-top: 1px solid #334155; text-align: center; z-index: 100; }
        .footer-links { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .footer-links span { color: #94a3b8; cursor: pointer; font-size: 0.8rem; text-decoration: underline; }

        /* المودال */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; }
        .modal-box { background: var(--card-bg); padding: 30px; border-radius: 15px; border: 1px solid var(--accent); width: 90%; max-width: 500px; text-align: right; }
    </style>
</head>
<body>

    <div id="save-notification" style="position: fixed; bottom: 80px; right: 20px; background: #22c55e; padding: 10px; border-radius: 8px; opacity: 0; transition: 0.5s; z-index: 1000;">تم الحفظ ✓</div>

    <div id="name-modal" class="modal-overlay">
        <div class="modal-box" style="text-align: center;">
            <h2>مرحباً بك!</h2>
            <input type="text" id="player-name-input" style="width:100%; padding:10px; margin:10px 0; background:#0f172a; color:white; border:1px solid #334155; outline:none;" placeholder="اسمك هنا..." maxlength="15">
            <button class="btn buy" style="width:100%" onclick="saveName()">ابدأ اللعب</button>
        </div>
    </div>

    <div class="ad-container"><small>مساحة إعلانية Google AdSense</small></div>

    <div class="header">
        <div class="player-info">
            <div>مستوى <span id="lvl">1</span></div>
            <div id="player-name-display" style="color: var(--accent);">اللاعب</div>
        </div>
        <div class="exp-container"><div id="exp-fill"></div></div>
        <div id="coin-count">0</div>
    </div>

    <div class="game-area" id="click-area">
        <button class="coin-btn" id="coin" onclick="handleMine(event)">💰</button>
    </div>

    <div class="main-layout">
        <div class="column">
            <div class="box">
                <h3>التطويرات</h3>
                <div class="item">
                    <div>قوة الضغطة<br><small>السعر: <span id="c1">50</span></small></div>
                    <button class="btn buy" id="b1" onclick="upgradeClick()">تطوير</button>
                </div>
                <div class="item">
                    <div>تعدين آلي<br><small>السعر: <span id="c2">150</span></small></div>
                    <button class="btn buy" id="b2" onclick="upgradeAuto()">تطوير</button>
                </div>
            </div>
            <div class="box">
                <h3>الأشكال</h3>
                <div class="skin-grid" id="skin-grid"></div>
            </div>
        </div>
        <div class="column">
            <div class="box">
                <h3>الصدارة</h3>
                <ul id="leaderboard" style="list-style:none; padding:0;"></ul>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <span onclick="alert('سيتم إضافة الصفحات لاحقاً')">الخصوصية</span>
            <span onclick="alert('تواصل معنا عبر إكس')">الدعم</span>
        </div>
    </footer>

    <script>
        // --- نظام الصوت البرمجي (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(freq, type, duration, vol) {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        const sounds = {
            click: () => playSound(600, 'sine', 0.1, 0.2),
            upgrade: () => {
                playSound(400, 'square', 0.1, 0.1);
                setTimeout(() => playSound(600, 'square', 0.1, 0.1), 50);
            },
            levelUp: () => {
                const freqs = [400, 500, 600, 800];
                freqs.forEach((f, i) => setTimeout(() => playSound(f, 'sine', 0.3, 0.2), i * 150));
            }
        };

        // --- بيانات اللعبة ---
        let gameData = {
            playerName: "", coins: 0, clickPower: 6, autoRate: 0, level: 1, exp: 0, expNext: 100,
            pClick: 50, pAuto: 150, currentSkin: 0
        };

        const skinData = [
            {icon: "💰", lvl: 1, color: "#ffde33", border: "#b38f00"},
            {icon: "🔥", lvl: 5, color: "#f97316", border: "#9a3412"},
            {icon: "💎", lvl: 10, color: "#a5f3fc", border: "#0ea5e9"},
            {icon: "🚀", lvl: 20, color: "#c084fc", border: "#7e22ce"}
        ];

        function handleMine(event) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            sounds.click();

            gameData.coins += gameData.clickPower;
            gainExp(gameData.clickPower);

            // تحديد إحداثيات الضغطة بدقة للتطاير
            const rect = event.target.getBoundingClientRect();
            const x = event.clientX || (rect.left + rect.width / 2);
            const y = event.clientY || (rect.top + rect.height / 2);
            createParticle(x, y);
            
            const counter = document.getElementById('coin-count');
            counter.style.transform = "scale(1.1)";
            setTimeout(() => counter.style.transform = "scale(1)", 50);

            updateUI();
        }

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.innerText = `+${gameData.clickPower}`;
            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;

            const xMove = (Math.random() - 0.5) * 150;
            const yMove = -150 - Math.random() * 50;
            particle.style.setProperty('--x', `${xMove}px`);
            particle.style.setProperty('--y', `${yMove}px`);

            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 800);
        }

        function gainExp(amt) {
            gameData.exp += amt;
            if (gameData.exp >= gameData.expNext) {
                gameData.level++;
                gameData.exp = 0;
                gameData.expNext = Math.floor(gameData.expNext * 1.8);
                sounds.levelUp();
                alert(`مبروك! وصلت للمستوى ${gameData.level}`);
            }
        }

        function upgradeClick() {
            if(gameData.coins >= gameData.pClick) {
                gameData.coins -= gameData.pClick;
                gameData.clickPower += 2;
                gameData.pClick = Math.floor(gameData.pClick * 1.5);
                sounds.upgrade();
                updateUI();
            }
        }

        function upgradeAuto() {
            if(gameData.coins >= gameData.pAuto) {
                gameData.coins -= gameData.pAuto;
                gameData.autoRate += 5;
                gameData.pAuto = Math.floor(gameData.pAuto * 1.6);
                sounds.upgrade();
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('coin-count').innerText = Math.floor(gameData.coins);
            document.getElementById('lvl').innerText = gameData.level;
            document.getElementById('exp-fill').style.width = (gameData.exp / gameData.expNext * 100) + "%";
            document.getElementById('c1').innerText = Math.floor(gameData.pClick);
            document.getElementById('c2').innerText = Math.floor(gameData.pAuto);
            document.getElementById('b1').disabled = gameData.coins < gameData.pClick;
            document.getElementById('b2').disabled = gameData.coins < gameData.pAuto;
            renderSkins();
            updateLeaderboard();
        }

        function updateLeaderboard() {
            const lb = document.getElementById('leaderboard');
            const players = [
                {name: gameData.playerName || "أنت", lvl: gameData.level, isMe: true},
                {name: "Ahmed_Pro", lvl: 42, isMe: false},
                {name: "SARA_99", lvl: 35, isMe: false}
            ].sort((a,b) => b.lvl - a.lvl);
            
            lb.innerHTML = players.map(p => `
                <li style="padding:8px; border-bottom:1px solid #334155; display:flex; justify-content:space-between; ${p.isMe?'background:rgba(56,189,248,0.1)':''}">
                    <span>${p.name}</span>
                    <span style="color:var(--accent)">LVL ${p.lvl}</span>
                </li>
            `).join('');
        }

        function renderSkins() {
            const grid = document.getElementById('skin-grid');
            grid.innerHTML = '';
            skinData.forEach((s, i) => {
                const div = document.createElement('div');
                const locked = gameData.level < s.lvl;
                div.className = `skin-unit ${locked ? 'locked' : ''} ${gameData.currentSkin === i ? 'active' : ''}`;
                div.innerHTML = s.icon;
                if(!locked) div.onclick = () => { gameData.currentSkin = i; applySkin(i); };
                grid.appendChild(div);
            });
        }

        function applySkin(i) {
            const s = skinData[i];
            const btn = document.getElementById('coin');
            btn.innerHTML = s.icon;
            btn.style.background = `radial-gradient(circle, ${s.color}, ${s.border})`;
            btn.style.borderColor = s.border;
            btn.style.boxShadow = `0 12px 0 ${s.border}`;
            renderSkins();
        }

        function saveName() {
            const n = document.getElementById('player-name-input').value.trim();
            if(n) {
                gameData.playerName = n;
                document.getElementById('player-name-display').innerText = n;
                document.getElementById('name-modal').style.display = 'none';
                save();
                updateUI();
            }
        }

        function save() { localStorage.setItem('coinGame_v2', JSON.stringify(gameData)); }
        function load() {
            const s = localStorage.getItem('coinGame_v2');
            if(s) {
                gameData = {...gameData, ...JSON.parse(s)};
                document.getElementById('player-name-display').innerText = gameData.playerName;
            } else {
                document.getElementById('name-modal').style.display = 'flex';
            }
        }

        setInterval(() => { if(gameData.autoRate > 0) { gameData.coins += gameData.autoRate; updateUI(); } }, 1000);
        setInterval(save, 5000);

        window.onload = () => { load(); updateUI(); applySkin(gameData.currentSkin); };
    </script>
</body>
</html>
